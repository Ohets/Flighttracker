<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ProFlight Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#07111f}#map{position:fixed;inset:0;width:100%;height:100%;z-index:1}header{position:fixed;top:0;left:0;right:0;height:58px;z-index:1000;background:rgba(5,15,28,.95);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;box-shadow:0 2px 12px #0008}.logo{font-weight:800;font-size:18px;white-space:nowrap}.credits{margin-left:auto;background:#172a40;border-radius:10px;padding:8px 12px;font-weight:700}#menuBtn{display:none;border:0;border-radius:9px;background:#1769aa;color:#fff;font-size:20px;padding:7px 11px}#panel{position:fixed;z-index:1100;top:70px;right:12px;width:320px;max-height:calc(100vh - 84px);overflow:auto;background:rgba(255,255,255,.97);border-radius:14px;padding:15px;box-shadow:0 8px 30px #0008}h2{font-size:18px;margin:0 0 10px;color:#222}.small{font-size:13px;color:#555;line-height:1.4}.search{display:flex;gap:6px;margin-bottom:8px}.search input{min-width:0;flex:1;border:1px solid #ccd5df;border-radius:9px;padding:11px;font-size:14px}.search button{width:auto;margin:0;padding:11px 14px}button{width:100%;border:0;border-radius:9px;padding:12px;margin:6px 0;font-size:14px;font-weight:700;cursor:pointer;background:#1769aa;color:#fff}button.premium{background:#7a4fd1}button.secondary{background:#607080}button:disabled{opacity:.55}.status{margin-top:8px;padding:9px;border-radius:9px;background:#edf2f7;color:#222;font-size:13px;line-height:1.35}#closeBtn{display:none}#loading{position:fixed;z-index:1200;top:70px;left:50%;transform:translateX(-50%);display:none;background:#07111f;color:#fff;padding:8px 14px;border-radius:20px;border:1px solid #456;font-size:13px}.modal{display:none;position:fixed;inset:0;z-index:2000;background:#0009;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modalBox{max-width:420px;width:100%;background:#fff;border-radius:16px;padding:20px;text-align:center;box-shadow:0 15px 50px #000}.modalBox h3{color:#c0392b}.modalBox a{display:inline-block;background:#0070ba;color:#fff;text-decoration:none;padding:12px 20px;border-radius:10px;font-weight:bold}.leaflet-control-zoom{margin-top:68px!important}@media(max-width:700px){header{height:52px;padding:7px 9px}.logo{font-size:16px}.credits{font-size:13px;padding:7px 9px}#menuBtn{display:block}#panel{top:60px;right:8px;left:8px;width:auto;max-height:calc(100vh - 68px);display:none}#panel.open{display:block}#closeBtn{display:block}.leaflet-control-zoom{margin-top:62px!important}}
</style>
</head>
<body>
<div id="map"></div>
<header><button id="menuBtn" aria-label="Menü">☰</button><div class="logo">✈️ ProFlight Tracker</div><div class="credits">💰 <span id="credit-count">500</span></div></header>
<div id="loading">Flüge werden geladen…</div>
<aside id="panel">
<button id="closeBtn" class="secondary">Karte anzeigen</button>
<h2>Flug suchen</h2>
<div class="search"><input id="flightSearch" type="text" placeholder="z. B. LH123 oder DLH123" autocomplete="off"><button id="searchBtn">🔎 Suchen</button></div>
<div class="small">Suche nach Flugnummer, ICAO-Flugnummer oder Registrierung. Danach wird der gefundene Flug auf der Karte markiert.</div>
<div id="searchStatus" class="status" style="display:none"></div>
<h2 style="margin-top:15px">Flugverkehr</h2>
<button id="freeBtn">✈️ Flüge laden – kostenlos</button>
<button id="premiumBtn" class="premium">📡 Live-Radar – 50 Credits</button>
<button id="stopBtn" class="secondary" style="display:none">⏹ Live-Radar stoppen</button>
<div id="status" class="status">Karte wird initialisiert…</div>
<button id="buyBtn" class="secondary">💳 Credits über PayPal</button>
</aside>
<div id="creditsModal" class="modal"><div class="modalBox"><h3>Keine Credits mehr</h3><p>Du benötigst 50 Credits für den Live-Radar.</p><a href="https://www.paypal.com/donate/?hosted_button_id=HF3HYZ9J3QV4U" target="_blank" rel="noopener">PayPal öffnen</a><br><br><button id="modalClose" class="secondary">Schließen</button></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const AIRLABS_API_KEY="840b01bb-121e-468a-87f6-c46693826b72",PAYPAL_URL="https://www.paypal.com/donate/?hosted_button_id=HF3HYZ9J3QV4U",CREDIT_KEY="tracker_credits",LIVE_COST=50,PAYPAL_WAIT_MS=30000,PAYMENT_KEY="flighttracker_paypal_pending";
let credits=localStorage.getItem(CREDIT_KEY)===null?500:Math.max(0,parseInt(localStorage.getItem(CREDIT_KEY),10)||0),markers=[],liveTimer=null,requestRunning=false;
const $=id=>document.getElementById(id);$("credit-count").textContent=credits;
const map=L.map("map",{zoomControl:true}).setView([50.1109,8.6821],5);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);
function saveCredits(){localStorage.setItem(CREDIT_KEY,String(credits));$("credit-count").textContent=credits)}
function setStatus(t){$("status").textContent=t}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function clearMarkers(){markers.forEach(m=>map.removeLayer(m));markers=[]}
function bbox(){const b=map.getBounds();return[b.getSouth(),b.getWest(),b.getNorth(),b.getEast()].join(",")}
function aircraftType(f){return f.aircraft_type||f.aircraft_icao||f.aircraft||f.model||"Nicht verfügbar"}
function flightLabel(f){return f.flight_icao||f.flight_iata||f.flight_number||f.reg_number||f.hex||"Unbekannt"}
function addFlight(f,focus=false){const lat=Number(f.lat),lng=Number(f.lng);if(!Number.isFinite(lat)||!Number.isFinite(lng))return null;const heading=Number(f.dir)||0;const icon=L.divIcon({className:"plane-marker",html:'<div style="font-size:23px;line-height:23px;transform:rotate('+heading+'deg);">✈️</div>',iconSize:[28,28],iconAnchor:[14,14]});const callsign=flightLabel(f),squawk=f.squawk||"Nicht verfügbar",hex=f.hex||"Nicht verfügbar",type=aircraftType(f),registration=f.reg_number||f.registration||"Nicht verfügbar";const marker=L.marker([lat,lng],{icon}).bindPopup("<b>Flug: "+esc(callsign)+"</b><br><b>Flugzeugtyp:</b> "+esc(type)+"<br><b>Registrierung:</b> "+esc(registration)+"<br>Geschwindigkeit: "+esc(f.speed||"-")+" km/h<br>Höhe: "+esc(f.alt||"-")+" ft<br>Richtung: "+esc(heading)+"°<br><b>Transponder / Squawk:</b> "+esc(squawk)+"<br><b>ICAO24:</b> "+esc(hex));marker.addTo(map);markers.push(marker);if(focus){map.setView([lat,lng],10);marker.openPopup()}return marker}
async function fetchFlights(){if(requestRunning)return;requestRunning=true;$("loading").style.display="block";$("freeBtn").disabled=true;$("premiumBtn").disabled=true;try{const url="https://airlabs.co/api/v9/flights?api_key="+encodeURIComponent(AIRLABS_API_KEY)+"&bbox="+encodeURIComponent(bbox());const response=await fetch(url,{cache:"no-store"});if(!response.ok)throw new Error("HTTP "+response.status);const data=await response.json();if(data.error)throw new Error(data.error.message||"AirLabs API Fehler");const flights=Array.isArray(data.response)?data.response:[];clearMarkers();flights.forEach(addFlight);setStatus(flights.length+" Flüge angezeigt. Aktualisiert: "+new Date().toLocaleTimeString())}catch(error){console.error(error);setStatus("Flüge konnten nicht geladen werden: "+error.message)}finally{requestRunning=false;$("loading").style.display="none";$("freeBtn").disabled=false;$("premiumBtn").disabled=false}}
async function searchFlight(){const query=$("flightSearch").value.trim().toUpperCase();if(!query){$("searchStatus").style.display="block";$("searchStatus").textContent="Bitte eine Flugnummer eingeben.";return}$("searchStatus").style.display="block";$("searchStatus").textContent="Suche nach "+query+"…";try{const urls=["https://airlabs.co/api/v9/flights?api_key="+encodeURIComponent(AIRLABS_API_KEY)+"&flight_icao="+encodeURIComponent(query),"https://airlabs.co/api/v9/flights?api_key="+encodeURIComponent(AIRLABS_API_KEY)+"&flight_iata="+encodeURIComponent(query),"https://airlabs.co/api/v9/flights?api_key="+encodeURIComponent(AIRLABS_API_KEY)+"&reg_number="+encodeURIComponent(query)];let flights=[];for(const u of urls){const response=await fetch(u,{cache:"no-store"});const data=await response.json();flights=Array.isArray(data.response)?data.response:[];if(flights.length)break}if(!flights.length)throw new Error("Flug nicht gefunden oder momentan nicht live verfügbar.");clearMarkers();const flight=flights[0],marker=addFlight(flight,true);$("searchStatus").innerHTML="<b>Gefunden:</b> "+esc(flightLabel(flight))+"<br><b>Flugzeugtyp:</b> "+esc(aircraftType(flight));setStatus("Flug "+flightLabel(flight)+" gefunden.");if(marker)marker.openPopup()}catch(error){console.error(error);$("searchStatus").textContent=error.message}}
async function startLive(){if(liveTimer)return;await fetchFlights();liveTimer=setInterval(fetchFlights,10000);$("stopBtn").style.display="block";$("premiumBtn").style.display="none";setStatus("Live-Radar aktiv – Aktualisierung alle 10 Sekunden.")}
function stopLive(){if(liveTimer){clearInterval(liveTimer);liveTimer=null}$("stopBtn").style.display="none";$("premiumBtn").style.display="block";setStatus("Live-Radar gestoppt.")}
function resetPendingPayment(){localStorage.removeItem(PAYMENT_KEY)}
function beginPayPalPurchase(){resetPendingPayment();const startedAt=Date.now();localStorage.setItem(PAYMENT_KEY,JSON.stringify({startedAt,credited:false}));window.open(PAYPAL_URL,"_blank","noopener");}
function checkPayPalReturn(){const raw=localStorage.getItem(PAYMENT_KEY);if(!raw)return;let pending;try{pending=JSON.parse(raw)}catch(e){resetPendingPayment();return}const elapsed=Date.now()-Number(pending.startedAt||0);resetPendingPayment();if(pending.credited)return;if(elapsed>=PAYPAL_WAIT_MS){credits+=100;saveCredits();alert("Credits wurden gutgeschrieben.")}else{alert("Keine Credits wurden gutgeschrieben.")}}
$("searchBtn").onclick=searchFlight;$("flightSearch").addEventListener("keydown",e=>{if(e.key==="Enter")searchFlight()});$("freeBtn").onclick=fetchFlights;$("premiumBtn").onclick=()=>{if(credits<LIVE_COST){$("creditsModal").classList.add("open");return}credits-=LIVE_COST;saveCredits();startLive()};$("stopBtn").onclick=stopLive;$("buyBtn").onclick=beginPayPalPurchase;$("modalClose").onclick=()=>$("creditsModal").classList.remove("open");$("creditsModal").onclick=e=>{if(e.target===$("creditsModal"))$("creditsModal").classList.remove("open")};$("menuBtn").onclick=()=>$("panel").classList.toggle("open");$("closeBtn").onclick=()=>$("panel").classList.remove("open");window.addEventListener("focus",checkPayPalReturn);window.addEventListener("pageshow",checkPayPalReturn);window.addEventListener("resize",()=>setTimeout(()=>map.invalidateSize(),100));document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkPayPalReturn();if(document.hidden&&liveTimer)stopLive()});setTimeout(()=>{map.invalidateSize();setStatus("Karte bereit. Du kannst jetzt Flüge suchen oder laden.")},500);
</script>
</body>
</html>
