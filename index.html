<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ProFlight Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#07111f}#map{position:fixed;inset:0;width:100%;height:100%;z-index:1}.top{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(5,15,28,.96);color:#fff;z-index:1000;display:flex;align-items:center;padding:7px 10px;gap:8px}.logo{font-size:17px;font-weight:bold;white-space:nowrap}.credits{margin-left:auto;background:#172a40;border-radius:10px;padding:8px 11px;font-weight:bold;font-size:14px}.menu{display:none;background:#1769aa;color:#fff;border:0;border-radius:8px;padding:7px 10px;font-size:20px}.panel{position:fixed;z-index:1100;top:68px;right:10px;width:320px;max-height:calc(100vh - 78px);overflow:auto;background:rgba(255,255,255,.97);border-radius:14px;padding:15px;box-shadow:0 8px 30px #0008}.panel h2{font-size:18px;color:#222;margin:0 0 10px}.small{font-size:13px;color:#555;line-height:1.4}.search{display:flex;gap:6px}.search input{flex:1;min-width:0;padding:11px;border:1px solid #ccd5df;border-radius:8px;font-size:14px}.search button{width:auto}.btn{display:block;width:100%;border:0;border-radius:9px;padding:12px;margin:7px 0;background:#1769aa;color:#fff;font-size:14px;font-weight:bold}.purple{background:#7a4fd1}.gray{background:#607080}.status{background:#edf2f7;color:#222;padding:9px;border-radius:9px;font-size:13px;line-height:1.4;margin-top:8px}.close{display:none}.loading{display:none;position:fixed;z-index:1500;top:66px;left:50%;transform:translateX(-50%);background:#07111f;color:#fff;padding:8px 14px;border-radius:20px}.modal{display:none;position:fixed;inset:0;z-index:3000;background:#0009;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{background:#fff;width:100%;max-width:400px;border-radius:15px;padding:22px;text-align:center}.box a{display:inline-block;background:#0070ba;color:#fff;text-decoration:none;padding:12px 20px;border-radius:9px;font-weight:bold}.leaflet-control-zoom{margin-top:62px!important}@media(max-width:700px){.menu{display:block}.panel{display:none;left:8px;right:8px;width:auto;top:62px;max-height:calc(100vh - 70px)}.panel.show{display:block}.close{display:block}.logo{font-size:15px}.credits{font-size:13px}}
</style>
</head>
<body>
<div id="map"></div>
<div class="top"><button id="menu" class="menu">☰</button><div class="logo">✈️ ProFlight Tracker</div><div class="credits">💰 <span id="credits">500</span></div></div>
<div id="loading" class="loading">Flüge werden geladen…</div>
<div id="panel" class="panel">
<button id="close" class="btn gray close">Karte anzeigen</button>
<h2>Flug suchen</h2>
<div class="search"><input id="search" placeholder="z. B. LH123 oder DLH123"><button id="searchBtn" class="btn">🔎</button></div>
<div id="searchStatus" class="status" style="display:none"></div>
<h2 style="margin-top:15px">Flugverkehr</h2>
<button id="free" class="btn">✈️ Flüge laden – kostenlos</button>
<button id="live" class="btn purple">📡 Live-Radar – 50 Credits</button>
<button id="stop" class="btn gray" style="display:none">⏹ Live-Radar stoppen</button>
<div id="status" class="status">Karte wird gestartet…</div>
<button id="buy" class="btn gray">💳 Credits über PayPal</button>
</div>
<div id="modal" class="modal"><div class="box"><h3>Keine Credits mehr</h3><p>Du benötigst 50 Credits für den Live-Radar.</p><button id="modalPay" class="btn">PayPal öffnen</button><button id="modalClose" class="btn gray">Schließen</button></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
'use strict';
var API='840b01bb-121e-468a-87f6-c46693826b72';
var PAYPAL='https://www.paypal.com/donate/?hosted_button_id=HF3HYZ9J3QV4U';
var CREDIT_KEY='tracker_credits';
var PAYMENT_KEY='tracker_paypal_started';
var WAIT=30000;
function el(id){return document.getElementById(id)}
var credits;
var saved=localStorage.getItem(CREDIT_KEY);
credits=saved===null?500:parseInt(saved,10);
if(isNaN(credits)||credits<0)credits=500;
el('credits').textContent=credits;
if(!window.L){el('status').textContent='Karte konnte nicht geladen werden. Bitte Internetverbindung prüfen.';return}
var map=L.map('map').setView([50.1109,8.6821],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
var markers=[];var liveTimer=null;var busy=false;
function save(){localStorage.setItem(CREDIT_KEY,String(credits));el('credits').textContent=credits}
function status(t){el('status').textContent=t}
function clear(){for(var i=0;i<markers.length;i++)map.removeLayer(markers[i]);markers=[]}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}
function type(f){return f.aircraft_type||f.aircraft_icao||f.aircraft||f.model||'Nicht verfügbar'}
function label(f){return f.flight_icao||f.flight_iata||f.flight_number||f.reg_number||f.hex||'Unbekannt'}
function add(f,focus){var lat=Number(f.lat),lng=Number(f.lng);if(!isFinite(lat)||!isFinite(lng))return null;var dir=Number(f.dir)||0;var icon=L.divIcon({className:'plane',html:'<div style="font-size:23px;transform:rotate('+dir+'deg)">✈️</div>',iconSize:[28,28],iconAnchor:[14,14]});var marker=L.marker([lat,lng],{icon:icon});var html='<b>Flug: '+esc(label(f))+'</b><br><b>Flugzeugtyp:</b> '+esc(type(f))+'<br><b>Registrierung:</b> '+esc(f.reg_number||f.registration||'Nicht verfügbar')+'<br><b>Geschwindigkeit:</b> '+esc(f.speed||'-')+' km/h<br><b>Höhe:</b> '+esc(f.alt||'-')+' ft<br><b>Richtung:</b> '+esc(dir)+'°<br><b>Transponder / Squawk:</b> '+esc(f.squawk||'Nicht verfügbar')+'<br><b>ICAO24:</b> '+esc(f.hex||'Nicht verfügbar')+'<br><b>Start:</b> '+esc(f.dep_iata||f.dep_icao||'Nicht verfügbar')+'<br><b>Ziel:</b> '+esc(f.arr_iata||f.arr_icao||'Nicht verfügbar');marker.bindPopup(html);marker.addTo(map);markers.push(marker);if(focus){map.setView([lat,lng],10);marker.openPopup()}return marker}
function bbox(){var b=map.getBounds();return b.getSouth()+','+b.getWest()+','+b.getNorth()+','+b.getEast()}
function fetchFlights(){if(busy)return;busy=true;el('loading').style.display='block';fetch('https://airlabs.co/api/v9/flights?api_key='+encodeURIComponent(API)+'&bbox='+encodeURIComponent(bbox()),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(data){if(data.error)throw new Error(data.error.message||'AirLabs Fehler');var flights=Array.isArray(data.response)?data.response:[];clear();for(var i=0;i<flights.length;i++)add(flights[i],false);status(flights.length+' Flüge angezeigt. Aktualisiert: '+new Date().toLocaleTimeString())}).catch(function(e){console.error(e);status('Flüge konnten nicht geladen werden: '+e.message)}).finally(function(){busy=false;el('loading').style.display='none'})}
function searchFlight(){var q=el('search').value.trim().toUpperCase();if(!q){el('searchStatus').style.display='block';el('searchStatus').textContent='Bitte Flugnummer eingeben.';return}el('searchStatus').style.display='block';el('searchStatus').textContent='Suche…';var fields=['flight_icao','flight_iata','reg_number'];var index=0;function next(){if(index>=fields.length){el('searchStatus').textContent='Flug nicht gefunden oder momentan nicht live verfügbar.';return}var field=fields[index++];fetch('https://airlabs.co/api/v9/flights?api_key='+encodeURIComponent(API)+'&'+field+'='+encodeURIComponent(q),{cache:'no-store'}).then(function(r){return r.json()}).then(function(data){var a=Array.isArray(data.response)?data.response:[];if(a.length){clear();add(a[0],true);el('searchStatus').innerHTML='<b>Gefunden:</b> '+esc(label(a[0]))+'<br><b>Flugzeugtyp:</b> '+esc(type(a[0]));status('Flug '+label(a[0])+' gefunden.')}else next()}).catch(next)}next()}
function startLive(){if(liveTimer)return;fetchFlights();liveTimer=setInterval(fetchFlights,10000);el('live').style.display='none';el('stop').style.display='block';status('Live-Radar aktiv – Aktualisierung alle 10 Sekunden.')}
function stopLive(){if(liveTimer){clearInterval(liveTimer);liveTimer=null}el('live').style.display='block';el('stop').style.display='block';el('stop').style.display='none';status('Live-Radar gestoppt.')}
function beginPayPal(){localStorage.setItem(PAYMENT_KEY,String(Date.now()));window.open(PAYPAL,'_blank')}
function checkPayment(){var started=localStorage.getItem(PAYMENT_KEY);if(!started)return;localStorage.removeItem(PAYMENT_KEY);var elapsed=Date.now()-parseInt(started,10);if(elapsed>=WAIT){credits+=100;save();alert('Credits wurden gutgeschrieben.')}else{alert('Keine Credits wurden gutgeschrieben.')}}
el('free').onclick=fetchFlights;
el('searchBtn').onclick=searchFlight;
el('search').onkeydown=function(e){if(e.key==='Enter')searchFlight()};
el('live').onclick=function(){if(credits<50){el('modal').classList.add('show');return}credits-=50;save();startLive()};
el('stop').onclick=stopLive;
el('buy').onclick=beginPayPal;
el('modalPay').onclick=beginPayPal;
el('modalClose').onclick=function(){el('modal').classList.remove('show')};
el('menu').onclick=function(){el('panel').classList.toggle('show')};
el('close').onclick=function(){el('panel').classList.remove('show')};
window.addEventListener('focus',checkPayment);
window.addEventListener('pageshow',checkPayment);
document.addEventListener('visibilitychange',function(){if(!document.hidden)checkPayment();else if(liveTimer)stopLive()});
window.addEventListener('resize',function(){setTimeout(function(){map.invalidateSize()},100)});
setTimeout(function(){map.invalidateSize();status('Karte bereit. Du kannst Flüge suchen oder laden.')},500);
})();
</script>
</body>
</html>
