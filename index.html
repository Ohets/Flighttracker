;max-height:calc(100vh - 70px)}.panel.show{display:block}.close{display:block}.logo{font-size:15px}.credits{font-size:13px}}

<script>

function add(f,focus){var lat=Number(f.lat),lng=Number(f.lng);if(!isFinite(lat)||!isFinite(lng))return null;var dir=Number(f.dir)||0,icon=L.divIcon({className:'plane',html:'<div style="font-size:23px;transform:rotate('+dir+'deg)">✈️</div>',iconSize:[28,28],iconAnchor:[14,14]}),marker=L.marker([lat,lng],{icon:icon}),dep=airportCode(f,'dep'),arr=airportCode(f,'arr');var html='<b>Flug: '+esc(label(f))+'</b><br><b>Flugzeugtyp:</b> '+esc(type(f))+'<br><b>Registrierung:</b> '+esc(f.reg_number||f.registration||'Nicht verfügbar')+'<br><b>Geschwindigkeit:</b> '+esc(f.speed||'-')+' km/h<br><b>Höhe:</b> '+esc(f.alt||'-')+' ft<br><b>Richtung:</b> '+esc(dir)+'°<br><b>Transponder / Squawk:</b> '+esc(f.squawk||'Nicht verfügbar')+'<br><b>ICAO24:</b> '+esc(f.hex||'Nicht verfügbar')+'<br><br><b>🛫 Start:</b><br>'+esc(dep||'Nicht verfügbar')+'<br><br><b>🛬 Ziel:</b><br>'+esc(arr||'Nicht verfügbar')+'<br><small>Flughafennamen werden geladen…</small>';marker.bindPopup(html);marker.on('click',function(){selectedFlight=f;selectedMarker=marker});marker.on('popupopen',function(){selectedFlight=f;selectedMarker=marker;updateAirportNames(marker,f)});marker.addTo(map);markers.push(marker);if(focus){map.setView([lat,lng],10);marker.openPopup()}return marker}

function searchFlight(){var q=el('search').value.trim().toUpperCase();if(!q){el('searchStatus').style.display='block';el('searchStatus').textContent='Bitte Flugnummer eingeben.';return}el('searchStatus').style.display='block';el('searchStatus').textContent='Suche…';var fields=['flight_icao','flight_iata','reg_number'],index=0;function next(){if(index>=fields.length){el('searchStatus').textContent='Flug nicht gefunden oder momentan nicht live verfügbar.';return}var field=fields[index++];airlabs('/api/v9/flights',((function(){var p={};p[field]=q;return p})()),{cache:'no-store'}).then(function(r){return r.json()}).then(function(data){var a=Array.isArray(data.response)?data.response:[];if(a.length){clear();add(a[0],true);el('searchStatus').innerHTML='<b>Gefunden:</b> '+esc(label(a[0]))+'<br><b>Flugzeugtyp:</b> '+esc(type(a[0]));status('Flug '+label(a[0])+' gefunden.')}else next()}).catch(next)}next()}

function premiumCost(cost){if(credits<cost){el('modal').classList.add('show');return false}credits-=cost;save();return true}

<script>
(function(){
  var menu=document.getElementById('menu'),panel=document.getElementById('panel'),close=document.getElementById('close');
  if(menu&&panel) menu.onclick=function(){panel.classList.toggle('show')};
  if(close&&panel) close.onclick=function(){panel.classList.remove('show')};

  function setStatus(t){var s=document.getElementById('status');if(s)s.textContent=t}
  function initMap(){
    if(window.__pfMap)return window.__pfMap;
    if(!window.L){setStatus('Kartenbibliothek konnte nicht geladen werden.');return null}
    try{
      window.__pfMap=L.map('map',{zoomControl:true}).setView([48.2082,16.3738],6);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(window.__pfMap);
      setTimeout(function(){window.__pfMap.invalidateSize()},300);
      setStatus('Karte bereit. Du kannst Flüge laden.');
      return window.__pfMap;
    }catch(e){console.error(e);setStatus('Kartenfehler: '+e.message);return null}
  }
  function api(path,params){
    var q=[];
    Object.keys(params||{}).forEach(function(k){if(params[k]!==undefined&&params[k]!==null&&params[k]!=='')q.push(encodeURIComponent(k)+'='+encodeURIComponent(params[k]))});
    var endpointName=path.indexOf('/api/v9/airports')!==-1?'airports':path.indexOf('/api/v9/flights')!==-1?'flights':'flight';q.push('endpoint='+encodeURIComponent(endpointName));return fetch('https://spboyylbuftzzpfkyhsy.supabase.co/functions/v1/airlabs-proxy'+(q.length?'?'+q.join('&'):''),{
      headers:{apikey:'sb_publishable_ZnBzx2f0CgQEezfJ8L0OA_HIPuIPij',Authorization:'Bearer sb_publishable_ZnBzx2f0CgQEezfJ8L0OA_HIPuIPij'}
    });
  }
  function loadFlights(){
    var map=initMap();if(!map)return;
    var b=map.getBounds(),bbox=b.getSouth()+','+b.getWest()+','+b.getNorth()+','+b.getEast();
    setStatus('Flüge werden geladen…');
    api('/api/v9/flights',{bbox:bbox}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(d){
      if(d.error)throw new Error(d.error.message||'AirLabs Fehler');
      var flights=Array.isArray(d.response)?d.response:[],count=0;
      if(window.__pfMarkers){window.__pfMarkers.forEach(function(m){map.removeLayer(m)})}
      window.__pfMarkers=[];
      flights.forEach(function(f){
        var lat=Number(f.lat),lng=Number(f.lng);if(!isFinite(lat)||!isFinite(lng))return;
        var m=L.marker([lat,lng]).addTo(map).bindPopup('<b>Flug:</b> '+String(f.flight_iata||f.flight_icao||f.flight_number||'Unbekannt'));
        window.__pfMarkers.push(m);count++;
      });
      setStatus(count+' Flüge angezeigt.');
    }).catch(function(e){console.error(e);setStatus('Flüge konnten nicht geladen werden: '+e.message)});
  }
  function searchFlight(){
    var q=(document.getElementById('search').value||'').trim().toUpperCase();
    if(!q){setStatus('Bitte Flugnummer eingeben.');return}
    api('/api/v9/flights',{flight_iata:q}).then(function(r){return r.json()}).then(function(d){
      var f=Array.isArray(d.response)&&d.response[0];if(!f){setStatus('Flug nicht gefunden.');return}
      var map=initMap();if(!map)return;var lat=Number(f.lat),lng=Number(f.lng);
      if(!isFinite(lat)||!isFinite(lng)){setStatus('Flug ist aktuell ohne Position.');return}
      map.setView([lat,lng],10);L.marker([lat,lng]).addTo(map).bindPopup('<b>Flug:</b> '+(f.flight_iata||f.flight_icao||q)).openPopup();
      setStatus('Flug '+(f.flight_iata||f.flight_icao||q)+' gefunden.');
    }).catch(function(e){setStatus('Suche fehlgeschlagen: '+e.message)});
  }
  setTimeout(function(){
    initMap();
    var ids=['free','live','searchBtn','details','follow','route','stop','buy','modalPay','modalClose'];
    ids.forEach(function(id){var b=document.getElementById(id);if(b)b.onclick=function(){}});
    var free=document.getElementById('free'),searchBtn=document.getElementById('searchBtn');
    if(free)free.onclick=loadFlights;
    if(searchBtn)searchBtn.onclick=searchFlight;
  },200);
})();
</script>
