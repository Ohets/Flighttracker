<body>
<div id="map"></div>
<div class="top"><button id="menu" class="menu" type="button">☰</button><div class="logo">✈️ ProFlight Tracker</div><div class="credits">💰 <span id="credits">500</span></div></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){

function airportLookup(code){if(!code)return Promise.resolve(null);if(airportCache[code])return Promise.resolve(airportCache[code]);var param=code.length===3?'iata_code':'icao_code';var p={_fields:'name,iata_code,icao_code,city,country_code,lat,lng'};p[param]=code;return airlabs('/api/v9/airports',p,{cache:'force-cache'}).then(function(r){return r.json()}).then(function(d){var a=Array.isArray(d.response)&&d.response[0]?d.response[0]:null;if(a)airportCache[code]=a;return a}).catch(function(){return null})}
function airportText(a,code){if(a)return esc(a.name)+(a.city?' ('+esc(a.city)+')':'')+' – '+esc(a.iata_code||a.icao_code||code);return esc(code||'Nicht verfügbar')}
function updateAirportNames(marker,f){var dep=airportCode(f,'dep'),arr=airportCode(f,'arr');Promise.all([airportLookup(dep),airportLookup(arr)]).then(function(a){marker.setPopupContent('<b>Flug: '+esc(label(f))+'</b><br><b>Flugzeugtyp:</b> '+esc(type(f))+'<br><b>Registrierung:</b> '+esc(f.reg_number||f.registration||'Nicht verfügbar')+'<br><b>Geschwindigkeit:</b> '+esc(f.speed||'-')+' km/h<br><b>Höhe:</b> '+esc(f.alt||'-')+' ft<br><b>Richtung:</b> '+esc(f.dir||0)+'°<br><b>Transponder / Squawk:</b> '+esc(f.squawk||'Nicht verfügbar')+'<br><b>ICAO24:</b> '+esc(f.hex||'Nicht verfügbar')+'<br><br><b>🛫 Start:</b><br>'+airportText(a[0],dep)+'<br><br><b>🛬 Ziel:</b><br>'+airportText(a[1],arr))})}
function add(f,focus){var lat=Number(f.lat),lng=Number(f.lng);if(!isFinite(lat)||!isFinite(lng))return null;var dir=Number(f.dir)||0,icon=L.divIcon({className:'plane',html:'<div style="font-size:23px;transform:rotate('+dir+'deg)">✈️</div>',iconSize:[28,28],iconAnchor:[14,14]}),marker=L.marker([lat,lng],{icon:icon});marker.bindPopup('<b>Flug: '+esc(label(f))+'</b><br><b>Flugzeugtyp:</b> '+esc(type(f))+'<br><b>Registrierung:</b> '+esc(f.reg_number||f.registration||'Nicht verfügbar')+'<br><b>Geschwindigkeit:</b> '+esc(f.speed||'-')+' km/h<br><b>Höhe:</b> '+esc(f.alt||'-')+' ft<br><b>Richtung:</b> '+esc(dir)+'°<br><b>Transponder / Squawk:</b> '+esc(f.squawk||'Nicht verfügbar')+'<br><b>ICAO24:</b> '+esc(f.hex||'Nicht verfügbar')+'<br><br><b>🛫 Start:</b><br>'+esc(airportCode(f,'dep')||'Nicht verfügbar')+'<br><br><b>🛬 Ziel:</b><br>'+esc(airportCode(f,'arr')||'Nicht verfügbar')+'<br><small>Flughafennamen werden geladen…</small>');marker.on('click',function(){selectedFlight=f;selectedMarker=marker});marker.on('popupopen',function(){selectedFlight=f;selectedMarker=marker;updateAirportNames(marker,f)});marker.addTo(map);markers.push(marker);if(focus){map.setView([lat,lng],10);marker.openPopup()}return marker}
function bbox(){var b=map.getBounds(),south=b.getSouth(),west=b.getWest(),north=b.getNorth(),east=b.getEast();var latSpan=north-south,lonSpan=east-west;if(latSpan>10){var cLat=(south+north)/2;south=cLat-5;north=cLat+5}if(lonSpan>15){var cLng=(west+east)/2;west=cLng-7.5;east=cLng+7.5}return south.toFixed(4)+','+west.toFixed(4)+','+north.toFixed(4)+','+east.toFixed(4)}
function fetchFlights(){if(busy)return;busy=true;el('loading').style.display='block';var body={endpoint:'flights',bbox:bbox()};fetch(AIRLABS_PROXY,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:'Bearer '+SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify(body),cache:'no-store'}).then(function(r){return r.text().then(function(t){var data;try{data=JSON.parse(t)}catch(_){throw new Error('Ungültige Antwort vom Server: '+t.slice(0,180))}if(!r.ok)throw new Error('HTTP '+r.status+(data&&data.error&&data.error.message?' – '+data.error.message:'')+(data&&data.error&&data.error.upstream?' | Upstream: '+data.error.upstream:'')+' | Serverantwort: '+t.slice(0,1000));return data})}).then(function(data){if(data.error)throw new Error((data.error.message||'Serverfehler')+(data.error.upstream?' | Upstream: '+data.error.upstream:''));var flights=Array.isArray(data.response)?data.response:[];clear();for(var i=0;i<flights.length;i++)add(flights[i],false);status(flights.length?flights.length+' Flüge angezeigt. Aktualisiert: '+new Date().toLocaleTimeString():'Keine Flüge im Kartenausschnitt.')}).catch(function(e){console.error('Flighttracker Fehler:',e);status('❌ FEHLER: '+e.message);el('searchStatus').style.display='block';el('searchStatus').textContent='Fehlerdiagnose: '+e.message}).finally(function(){busy=false;el('loading').style.display='none'})}
function searchFlight(){var q=el('search').value.trim().toUpperCase();if(!q){el('searchStatus').style.display='block';el('searchStatus').textContent='Bitte Flugnummer eingeben.';return}el('searchStatus').style.display='block';el('searchStatus').textContent='Suche…';var fields=['flight_icao','flight_iata','reg_number'],index=0;function next(){if(index>=fields.length){el('searchStatus').textContent='Flug nicht gefunden oder momentan nicht live verfügbar.';return}var field=fields[index++],p={};p[field]=q;airlabs('/api/v9/flights',p,{cache:'no-store'}).then(function(r){return r.json()}).then(function(data){var a=Array.isArray(data.response)?data.response:[];if(a.length){clear();add(a[0],true);el('searchStatus').innerHTML='<b>Gefunden:</b> '+esc(label(a[0]))+'<br><b>Flugzeugtyp:</b> '+esc(type(a[0]));status('Flug '+label(a[0])+' gefunden.')}else next()}).catch(next)}next()}
function updateCockpit(f){if(!f)return;var lat=Number(f.lat),lng=Number(f.lng),dir=Number(f.dir)||0;el('cockpitFlight').textContent=label(f);el('cockpitHud').innerHTML='HDG '+Math.round(dir)+'°<br>ALT '+esc(f.alt||'-')+' ft<br>SPD '+esc(f.speed||'-')+' km/h';el('cockpitInfo').innerHTML='Position: '+(isFinite(lat)?lat.toFixed(3):'–')+', '+(isFinite(lng)?lng.toFixed(3):'–')+'<br>Höhe: '+esc(f.alt||'-')+' ft<br>Geschwindigkeit: '+esc(f.speed||'-')+' km/h';el('cockpitView').style.transform='none';}
function refreshCockpit(){if(!selectedFlight)return;var p={};if(selectedFlight.hex)p.hex=selectedFlight.hex;else if(selectedFlight.flight_iata)p.flight_iata=selectedFlight.flight_iata;else if(selectedFlight.flight_icao)p.flight_icao=selectedFlight.flight_icao;else return;airlabs('/api/v9/flights',p,{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){var f=Array.isArray(d.response)&&d.response[0]?d.response[0]:null;if(f){selectedFlight=f;updateCockpit(f)}}).catch(function(e){console.warn('Cockpit update',e)})}
function openCockpit(){if(!selectedFlight){alert('Bitte zuerst ein Flugzeug auf der Karte auswählen.');return}el('cockpitView').classList.add('show');updateCockpit(selectedFlight);if(window.cockpitTimer)clearInterval(window.cockpitTimer);refreshCockpit();window.cockpitTimer=setInterval(refreshCockpit,10000)}
function closeCockpit(){el('cockpitView').classList.remove('show');if(window.cockpitTimer){clearInterval(window.cockpitTimer);window.cockpitTimer=null}}\nfunction startLive(){if(liveTimer)return;fetchFlights();liveTimer=setInterval(fetchFlights,10000);el('live').style.display='none';el('stop').style.display='block';status('Live-Radar aktiv – Aktualisierung alle 10 Sekunden.')}
function stopLive(){if(liveTimer){clearInterval(liveTimer);liveTimer=null}el('live').style.display='block';el('stop').style.display='none';status('Live-Radar gestoppt.')}
function premiumCost(cost){if(credits<cost){el('modal').classList.add('show');return false}credits-=cost;save();return true}
function premiumDetails(){if(!selectedFlight){alert('Bitte zuerst ein Flugzeug auf der Karte auswählen.');return}if(!premiumCost(25))return;var q=selectedFlight.flight_iata||selectedFlight.flight_icao;if(!q){credits+=25;save();alert('Keine Flugnummer verfügbar. Die 25 Credits wurden zurückerstattet.');return}airlabs('/api/v9/flight',(function(){var p={};p[selectedFlight.flight_iata?'flight_iata':'flight_icao']=q;return p})(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){var f=d.response||d;if(!f||f.error)throw new Error((f&&f.error&&f.error.message)||'Keine Detaildaten verfügbar.');alert('⭐ PREMIUM-FLUGDETAILS\n\nFlug: '+label(f)+'\nStatus: '+(f.status||'Nicht verfügbar')+'\nFlugzeug: '+(f.model||type(f))+'\nHersteller: '+(f.manufacturer||'Nicht verfügbar')+'\nMotor: '+(f.engine||'Nicht verfügbar')+'\nMotoren: '+(f.engine_count||'Nicht verfügbar')+'\nBaujahr: '+(f.built||'Nicht verfügbar')+'\nAbflug: '+(f.dep_time||f.dep_time_utc||'Nicht verfügbar')+'\nAnkunft: '+(f.arr_time||f.arr_time_utc||'Nicht verfügbar')+'\nTerminal/Gate: '+(f.arr_terminal||'-')+' / '+(f.arr_gate||'-'));status('Premium-Flugdaten geladen: '+label(f))}).catch(function(e){credits+=25;save();alert('Premium-Daten konnten nicht geladen werden. Die 25 Credits wurden zurückerstattet.\n\n'+e.message)})}
function followFlight(){if(!selectedFlight||!selectedMarker){alert('Bitte zuerst ein Flugzeug auf der Karte auswählen.');return}if(!premiumCost(10))return;map.setView(selectedMarker.getLatLng(),10);selectedMarker.openPopup();status('🎯 Flug wird auf der Karte fokussiert.')}
function showRoute(){if(!selectedFlight){alert('Bitte zuerst ein Flugzeug auf der Karte auswählen.');return}if(!premiumCost(20))return;var dep=airportCode(selectedFlight,'dep'),arr=airportCode(selectedFlight,'arr');if(!dep||!arr){credits+=20;save();alert('Keine Start-/Zielflughäfen vorhanden. Die 20 Credits wurden zurückerstattet.');return}Promise.all([airportLookup(dep),airportLookup(arr)]).then(function(a){if(!a[0]||!a[1]||!isFinite(Number(a[0].lat))||!isFinite(Number(a[0].lng))||!isFinite(Number(a[1].lat))||!isFinite(Number(a[1].lng))){credits+=20;save();alert('Flughafenpositionen nicht verfügbar. Die 20 Credits wurden zurückerstattet.');return}if(routeLine)map.removeLayer(routeLine);routeLine=L.polyline([[Number(a[0].lat),Number(a[0].lng)],[Number(a[1].lat),Number(a[1].lng)]],{weight:4,dashArray:'8 8'}).addTo(map);map.fitBounds(routeLine.getBounds(),{padding:[40,40]});status('🛫 Premium-Route: '+(a[0].name||dep)+' → '+(a[1].name||arr))})}
function beginPayPal(){try{localStorage.setItem(PAYMENT_KEY,String(Date.now()))}catch(e){}window.open(PAYPAL,'_blank')}
function checkPayment(){var started=null;try{started=localStorage.getItem(PAYMENT_KEY)}catch(e){}if(!started)return;localStorage.removeItem(PAYMENT_KEY);var elapsed=Date.now()-parseInt(started,10);if(elapsed>=WAIT){credits+=500;save();alert('Credits wurden gutgeschrieben.')}else alert('Keine Credits wurden gutgeschrieben.')}
el('free').onclick=fetchFlights;el('cockpit').onclick=openCockpit;el('cockpitClose').onclick=closeCockpit;el('details').onclick=premiumDetails;el('follow').onclick=followFlight;el('route').onclick=showRoute;el('searchBtn').onclick=searchFlight;el('search').onkeydown=function(e){if(e.key==='Enter')searchFlight()};el('live').onclick=function(){if(credits<50){el('modal').classList.add('show');return}credits-=50;save();startLive()};el('stop').onclick=stopLive;el('buy').onclick=beginPayPal;el('modalPay').onclick=beginPayPal;el('modalClose').onclick=function(){el('modal').classList.remove('show')};el('menu').onclick=function(){el('panel').classList.toggle('show')};el('close').onclick=function(){el('panel').classList.remove('show')};window.addEventListener('focus',checkPayment);window.addEventListener('pageshow',checkPayment);document.addEventListener('visibilitychange',function(){if(!document.hidden)checkPayment();else if(liveTimer)stopLive()});window.addEventListener('resize',function(){setTimeout(function(){if(map)map.invalidateSize()},100)});setTimeout(function(){if(map)map.invalidateSize();status('Karte bereit. Du kannst Flüge suchen oder laden.')},500);
})();
